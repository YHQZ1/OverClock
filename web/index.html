      body {

        color: #f3efe6;
        color-scheme: dark;

    <link rel="preload" href="/gdsc.png" as="image" />
    <link rel="icon" type="image/png" href="/gdsc-title.png" />
    <title>Overclock</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
