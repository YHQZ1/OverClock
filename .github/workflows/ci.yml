# Fast checks on every push and pull request: types, unit, integration, balance, build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (server + web)
        run: pnpm test:unit

      - name: Integration tests (real server + sockets)
        run: pnpm test:integration

      - name: Balance tests (bots)
        run: pnpm test:balance

      - name: Build
        run: pnpm build
