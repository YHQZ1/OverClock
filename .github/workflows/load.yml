# Load test: dozens of bot players play full matches at once against a real
# server; fails if a match doesn't finish or the server gets slow. Slow and a
# little noisy on shared runners, so it runs nightly and on demand — not on every push.
name: Load

on:
  schedule:
    - cron: "30 20 * * *" # nightly, 02:00 IST
  workflow_dispatch:
    inputs:
      rooms:
        description: "Rooms to run at once (every 4th is 2v2)"
        default: "30"
        required: false

jobs:
  load:
    name: Load test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run load test
        run: pnpm test:load
        env:
          LOAD_ROOMS: ${{ github.event.inputs.rooms || '30' }}
